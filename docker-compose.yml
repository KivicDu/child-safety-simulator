

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: child-safety-simulator
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      # Persist uploaded files and simulation data between restarts
      - ./uploads:/app/uploads
      - ./simulations:/app/simulations
      - ./parsed:/app/parsed
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Nginx reverse proxy (recommended for SSL/HTTPS)
  nginx:
    image: nginx:alpine
    container_name: child-safety-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
